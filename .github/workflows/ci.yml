name: CI

on:
  push:
  pull_request:

jobs:
  # Lint, build, bundle size and unit tests on every OS the extension supports: the unit tests cover the
  # Windows command-line quoting and path handling, which nothing else exercises on Windows and macOS.
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run check:size
      - run: npm test

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: npm ci
      # The UI tests run the tools of these samples (Jest, pytest, .NET with coverlet, and Mocha under the
      # c8 bundled in the packaged .vsix).
      - run: node scripts/setup-samples.mjs node-jest python-pytest dotnet-vstest-coverlet node-mocha
      - uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}
      # VS Code runs with the Chromium sandbox off-root; Ubuntu 24.04's AppArmor default blocks the
      # unprivileged user namespaces it needs.
      - run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: xvfb-run -a npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-test-results
          path: test-results/

  # The lightness budgets (design 6.1) on the built bundle. The limits are the same as everywhere;
  # the tests sample robustly (medians, best of 3 for main-thread blocks) because runners are noisy.
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:perf

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: npm ci
      - run: npm run build
      - run: node scripts/setup-samples.mjs
      - run: npm run test:e2e

  # The .vsix as a release builds it (release/coverage-tools-<version>.vsix), kept as an artifact.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-tools-vsix
          path: release/*.vsix
